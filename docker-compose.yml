services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracklive_backend
    ports:
      - "7860:7860"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracklive_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:7860
    depends_on:
      - backend
    restart: unless-stopped
